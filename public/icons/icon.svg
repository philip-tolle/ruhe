<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ruhe: Mondsichel über Bergen am Abendhimmel. Quelle für die PNG-Icons (npm run icons). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1026" />
      <stop offset="1" stop-color="#3A2F5B" />
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2C98A" stop-opacity="0.28" />
      <stop offset="1" stop-color="#F2C98A" stop-opacity="0" />
    </radialGradient>
    <mask id="crescent">
